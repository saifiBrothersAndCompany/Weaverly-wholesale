    .no-scrollbar::-webkit-scrollbar { display: none; }

    .app-shell {
      width: 100%;
      height: 100dvh;
      max-width: 100%;
      background-color: #FAF9F5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;

    /* Scroll-Aware Floating Bottom Dock Transition */
    #floating-bottom-dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: 0 12px calc(10px + env(safe-area-inset-bottom));
      transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1), opacity 260ms cubic-bezier(0.22, 1, 0.36, 1);
      transform: translateY(0);
      opacity: 1;
      pointer-events: none;
    }

    #floating-bottom-dock.dock-hidden {
      transform: translateY(130%);
      opacity: 0;
      pointer-events: none !important;
    }

    #floating-bottom-dock:not(.dock-hidden) .dock-interactive {
      pointer-events: auto;
    }

    @keyframes placeholderSlide {
      0% { opacity: 0; transform: translateY(6px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-6px); }
    }
    .placeholder-animate { animation: placeholderSlide 2.8s ease-in-out infinite; }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-enter { animation: viewFadeIn 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .sheet-backdrop { transition: opacity 240ms ease; }
    .sheet-panel { transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1); }

    .pressable { transition: transform 120ms ease, background-color 150ms ease; }
    .pressable:active { transform: scale(0.96); }

    .carousel-track { scroll-snap-type: x mandatory; scroll-behavior: smooth; }
    .carousel-slide { scroll-snap-align: start; }

    @keyframes popIn {
      0% { transform: scale(0.88); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .pop-in { animation: popIn 180ms ease-out; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shake 320ms ease-in-out; }

    // 2C. TAMPER-PROOF ORDER INTEGRITY ENGINE (FNV-64 + WebCrypto SHA-256)
    // -------------------------------------------------------------------------
    function canonicalOrderString(order) {
      const normalizedItems = (order.items || []).map((i) => ({
        itemId: String(i.itemId),
        name: String(i.name),
        variant: String(i.variant),
        qty: Number(i.qty),
        unitPrice: Number(i.price),
        unitMrp: Number(i.mrp || i.price),
        lineTotal: Number(i.price) * Number(i.qty),
      }));
      return JSON.stringify({
        id: String(order.id),
        isoTime: String(order.isoTime),
        customerName: String(order.customerName),
        customerPhone: String(order.customerPhone),
        address: String(order.address),
        slot: String(order.slot),
        paymentMode: String(order.paymentMode),
        items: normalizedItems,
        subtotal: Number(order.subtotal),
        deliveryFee: Number(order.deliveryFee),
        grandTotal: Number(order.grandTotal),
        salt: STORE_INTEGRITY_SALT,
      });
    }

    function computeSyncSeal(payloadStr) {
      let h1 = 0x811c9dc5;
      let h2 = 0xdeadbeef;
      for (let i = 0; i < payloadStr.length; i++) {
        const ch = payloadStr.charCodeAt(i);
        h1 ^= ch;
        h1 = Math.imul(h1, 0x01000193);
        h2 ^= ch + i * 31;
        h2 = Math.imul(h2, 0x85ebca6b);
      }
      const part1 = (h1 >>> 0).toString(16).padStart(8, '0').toUpperCase();
      const part2 = (h2 >>> 0).toString(16).padStart(8, '0').toUpperCase();
      return `${part1}${part2}`;
    }

    function sealOrderRecord(orderObj) {
      const payload = canonicalOrderString(orderObj);
      const signature = computeSyncSeal(payload);
      const sealed = {
        ...orderObj,
        integrityHash: signature,
        sealCode: `WV-${signature.slice(0, 8)}`,
        lockedByStore: true,
      };
      Object.freeze(sealed.items);
      return Object.freeze(sealed);
    }

    function verifyOrderIntegrity(order) {
      if (!order) return false;
      if (order.fromCloud) return order.tamperStatus === 'VERIFIED_EXACT' || order.tamperStatus === 'CUSTOM_CATALOG_ITEM';
      if (!order.integrityHash) return false;
      return computeSyncSeal(canonicalOrderString(order)) === order.integrityHash;
    }

    // -------------------------------------------------------------------------
    // 2D. REAL LIVE GPS DISTANCE CHECK (Haversine from Yamuna Vihar Hub)
    // -------------------------------------------------------------------------
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function detectLiveGPS() {
      if (!navigator.geolocation) {
        showToast('GPS not supported on this browser.', 'amber');
        return;
      }
      showToast('Detecting your distance from Yamuna Vihar Hub...', 'forest');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const dist = Number(
            haversineKm(HUB_COORDS.lat, HUB_COORDS.lng, pos.coords.latitude, pos.coords.longitude).toFixed(2)
          );
          const deliverable = dist <= HUB_COORDS.maxRadiusKm;
          state.liveGPS = {
            distanceKm: dist,
            deliverable,
            lat: pos.coords.latitude.toFixed(5),
            lng: pos.coords.longitude.toFixed(5),
            checkedAt: new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }),
          };
          saveStoreState();
          syncAllUI();
          showToast(
            deliverable
              ? `GPS Verified: ${dist} km from Hub (Deliverable!)`
              : `GPS Check: ${dist} km away (Outside 1.5 km Hub radius)`,
            deliverable ? 'emerald' : 'red'
          );
        },
        () => {
          showToast('Location permission denied. Using saved Yamuna Vihar address.', 'amber');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

      cutoff.setHours(17, 30, 0, 0); // 5:30 PM daily cutoff
      if (now < cutoff) {
        const diffMin = Math.max(1, Math.floor((cutoff - now) / 60000));
        const hrs = Math.floor(diffMin / 60);
        const mins = diffMin % 60;
        return {
          slotLabel: "Today's Evening • 6–9 PM",
          shortBadge: 'Today 6–9 PM',
          countdown: hrs > 0 ? `Order in ${hrs}h ${mins}m for today's slot` : `Order in ${mins}m for today's slot`,
          urgent: diffMin <= 60,
        };
      }
      return {
        slotLabel: "Tomorrow's Evening • 6–9 PM",
        shortBadge: 'Tomorrow 6–9 PM',
        countdown: "Today's 5:30 PM cutoff passed • Booking for Tomorrow 6–9 PM",
        urgent: false,

    function saveStoreState() {
      try {
        const snapshot = {
          customer: state.customer,
          favorites: state.favorites,
          storeConfig: state.storeConfig,
          products: state.products,
          packs: state.packs,
          cart: state.cart,
          geofence: state.geofence,
          liveGPS: state.liveGPS,
          orderLedger: state.orderLedger,
          installBannerDismissed: state.installBannerDismissed,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      } catch (e) {}
    }

    function loadStoreState() {
      const base = createInitialState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        if (parsed.customer) base.customer = parsed.customer;
        if (Array.isArray(parsed.favorites)) base.favorites = parsed.favorites;
        if (parsed.storeConfig) base.storeConfig = { ...base.storeConfig, ...parsed.storeConfig };
        if (Array.isArray(parsed.products) && parsed.products.length > 0) base.products = parsed.products;
        if (Array.isArray(parsed.packs) && parsed.packs.length > 0) base.packs = parsed.packs;
        if (parsed.cart && typeof parsed.cart === 'object') base.cart = parsed.cart;
        if (parsed.geofence && GEOFENCE_PRESETS[parsed.geofence]) base.geofence = parsed.geofence;
        if (parsed.liveGPS) base.liveGPS = parsed.liveGPS;
        if (Array.isArray(parsed.orderLedger)) base.orderLedger = parsed.orderLedger;
        if (typeof parsed.installBannerDismissed === 'boolean') base.installBannerDismissed = parsed.installBannerDismissed;
      } catch (e) {}
      return base;
    }

    const scrollTracker = { lastScrollTop: 0, isHidden: false };

    // -------------------------------------------------------------------------
    // 4. SELECTORS & HELPERS
    // -------------------------------------------------------------------------
    function getAllItems() { return [...state.products, ...state.packs]; }
    function findItemById(id) { return getAllItems().find((i) => i.id === id); }
    function getCartKey(itemId, variantIdx = 0) { return `${itemId}__${variantIdx}`; }
    function getCartQty(itemId, variantIdx = 0) {
      const entry = state.cart[getCartKey(itemId, variantIdx)];
      return entry ? entry.qty : 0;
    }
    function getTotalQtyForItem(itemId) {
      return Object.values(state.cart)
        .filter((e) => e.itemId === itemId)
        .reduce((sum, e) => sum + e.qty, 0);
    }

    function getCartTotals() {
      let itemCount = 0;
      let subtotal = 0;
      let mrpTotal = 0;
      const lines = [];

      for (const key of Object.keys(state.cart)) {
        const entry = state.cart[key];
        const item = findItemById(entry.itemId);
        if (!item || entry.qty <= 0) continue;
        const v = item.variants[entry.variantIdx] || item.variants[0];
        itemCount += entry.qty;
        subtotal += v.price * entry.qty;
        mrpTotal += v.mrp * entry.qty;
        lines.push({ key, item, variantIdx: entry.variantIdx, variant: v, qty: entry.qty });
      }

      const freeDeliveryThreshold = Number(state.storeConfig.freeDeliveryThreshold) || 499;
      const feeAmt = Number(state.storeConfig.smallCartFee) || 10;
      const smallCartFee = subtotal > 0 && subtotal < freeDeliveryThreshold ? feeAmt : 0;
      const remainingForFree = Math.max(0, freeDeliveryThreshold - subtotal);
      const wholesaleSavings = Math.max(0, mrpTotal - subtotal);
      const grandTotal = subtotal + smallCartFee;

      return {
        lines,
        itemCount,
        subtotal,
        mrpTotal,
        wholesaleSavings,
        smallCartFee,
        remainingForFree,
        freeDeliveryThreshold,
        grandTotal,
      };
    }

    function getDiscountPct(price, mrp) {
      if (!mrp || mrp <= price) return 0;
      return Math.round(((mrp - price) / mrp) * 100);
    }

    function getGeo() {
      const preset = GEOFENCE_PRESETS[state.geofence] || GEOFENCE_PRESETS.inside;
      const customAddr = state.customer
        ? `${state.customer.houseNo}${state.customer.landmark ? ', ' + state.customer.landmark : ''}`
        : preset.fullAddress;

      // If live GPS was checked and admin hasn't forced outside/edge simulation
      if (state.liveGPS && state.geofence === 'inside') {
        return {
          key: state.liveGPS.deliverable ? 'live_inside' : 'live_outside',
          shortLoc: state.liveGPS.deliverable ? 'Yamuna Vihar (Live GPS)' : `GPS (${state.liveGPS.distanceKm} km away)`,
          fullAddress: customAddr,
          distanceKm: state.liveGPS.distanceKm,
          deliverable: state.liveGPS.deliverable,

            ? `${state.liveGPS.distanceKm} km • Live GPS Verified`

      if (state.geofence === 'inside') {
        return { ...preset, fullAddress: customAddr };

      return preset;

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    function showToast(message, type = 'forest') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        forest: 'bg-forest text-white border-forest-light',
        emerald: 'bg-emerald-600 text-white border-emerald-500',
        amber: 'bg-amber-600 text-white border-amber-500',
        red: 'bg-red-600 text-white border-red-500',
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-xl border flex items-center gap-2 transition-all duration-300 opacity-0 -translate-y-2 max-w-[340px] text-center ${styles[type] || styles.forest}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
      });

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    // -------------------------------------------------------------------------
    // 6. SCROLL-AWARE FLOATING BOTTOM DOCK CONTROLLER
    // -------------------------------------------------------------------------
    function showFloatingDock() {
      const dock = document.getElementById('floating-bottom-dock');
      if (!dock) return;
      scrollTracker.isHidden = false;
      dock.classList.remove('dock-hidden');
    }

    function hideFloatingDock() {
      const dock = document.getElementById('floating-bottom-dock');
      if (!dock) return;
      scrollTracker.isHidden = true;
      dock.classList.add('dock-hidden');
    }

    function handleScrollContainerEvent(el) {
      if (!el) return;
      const currentTop = Math.max(0, el.scrollTop);
      const maxScroll = el.scrollHeight - el.clientHeight;
      const delta = currentTop - scrollTracker.lastScrollTop;

      if (maxScroll > 0 && currentTop >= maxScroll - 4 && delta > 0) {
        scrollTracker.lastScrollTop = currentTop;
        return;
      }

      if (currentTop <= 24) {
        showFloatingDock();
      } else if (delta > 8 && currentTop > 40) {
        if (!scrollTracker.isHidden) hideFloatingDock();
      } else if (delta < -6) {
        if (scrollTracker.isHidden) showFloatingDock();
      }

      scrollTracker.lastScrollTop = currentTop;
    }

    function bindScrollListeners() {
      scrollTracker.lastScrollTop = 0;
      document.querySelectorAll('[data-dock-scroll="true"]').forEach((el) => {
        el.addEventListener('scroll', () => handleScrollContainerEvent(el), { passive: true });
      });
    }

    // -------------------------------------------------------------------------
    // 7. CART MUTATIONS (With Bulk Guard)
    // -------------------------------------------------------------------------
    function addToCart(itemId, variantIdx = 0, evt = null) {
      if (evt) evt.stopPropagation();
      const item = findItemById(itemId);
      if (!item) return;

      if (!item.inStock) {
        showToast('Currently out of stock. Viewing verified substitutes.', 'amber');
        openPDP(itemId);
        return;
      }

      const key = getCartKey(itemId, variantIdx);
      const maxQty = Number(state.storeConfig.maxQtyPerSku) || 20;
      const currentQty = state.cart[key] ? state.cart[key].qty : 0;

      if (currentQty >= maxQty) {
        showToast(`Bulk cap reached (max ${maxQty} packs per item). Contact WhatsApp for bulk mandi orders.`, 'amber');
        return;
      }

      state.cart[key] = { itemId, variantIdx, qty: currentQty + 1 };
      showFloatingDock();
      saveStoreState();
      syncAllUI();
    }

    function decrementCart(itemId, variantIdx = 0, evt = null) {
      if (evt) evt.stopPropagation();
      const key = getCartKey(itemId, variantIdx);
      if (!state.cart[key]) return;
      state.cart[key].qty -= 1;
      if (state.cart[key].qty <= 0) delete state.cart[key];
      saveStoreState();
      syncAllUI();
    }

    function reorderPastOrder(orderId) {
      const order = state.orderLedger.find((o) => o.id === orderId);
      if (!order) return;

      let addedCount = 0;
      let oosSkipped = 0;

      order.items.forEach((line) => {
        const item = findItemById(line.itemId);
        if (item && item.inStock) {
          const vIdx = line.variantIdx || 0;
          const key = getCartKey(line.itemId, vIdx);
          if (!state.cart[key]) {
            state.cart[key] = { itemId: line.itemId, variantIdx: vIdx, qty: line.qty };
          } else {
            state.cart[key].qty += line.qty;
          }
          addedCount += line.qty;
        } else {
          oosSkipped += 1;
        }
      });

      showFloatingDock();
      saveStoreState();
      syncAllUI();

      if (addedCount > 0) {
        showToast(
          oosSkipped > 0
            ? `Added ${addedCount} items (${oosSkipped} OOS skipped)`
            : `Added ${addedCount} items from #${orderId} to cart!`,
          'emerald'
        );
      } else {
        showToast('All items from this order are currently out of stock.', 'amber');
      }
    }

    function copyOrderReceipt(orderId) {
      const allOrders = [...(state.cloudOrders || []), ...(state.orderLedger || [])];
      const order = allOrders.find((o) => o.id === orderId);
      if (!order) return;
      const lines = order.items.map((i) => `• ${i.qty}× ${i.name} (${i.variant}) = ₹${i.price * i.qty}`).join('\n');
      const text = `WEAVERLY WHOLESALE — VERIFIED RECEIPT\nOrder ID: #${order.id}\nVerification Seal: ${order.sealCode}\nDate: ${order.placedAt} | Slot: ${order.slot}\nCustomer: ${order.customerName} (${order.customerPhone})\nAddress: ${order.address}\n\n${lines}\n\nSubtotal: ₹${order.subtotal}\nDelivery Fee: ${order.deliveryFee === 0 ? 'FREE' : '₹' + order.deliveryFee}\nTotal Payable (${order.paymentMode}): ₹${order.grandTotal}`;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast(`Verified receipt #${order.id} copied!`, 'emerald');
      } catch (e) {
        showToast('Could not copy receipt.', 'amber');
      }
    }

      const artSvg = SVG_ART[product.art] ? SVG_ART[product.art]() : '';

      return `
        <div onclick="openPDP('${product.id}', ${activeVIdx})"
          class="bg-white rounded-2xl border ${totalInCart > 0 ? 'border-emeraldBrand/45 ring-1 ring-emeraldBrand/15' : 'border-borderSubtle'} p-2.5 flex flex-col justify-between shadow-[0_2px_10px_rgba(26,61,40,0.04)] cursor-pointer transition hover:shadow-md relative overflow-hidden">

      if (state.activeTab !== 'home') return;
      state.searchQuery = prefill;
      document.getElementById('search-overlay').classList.remove('hidden');
      renderSearchOverlay();
      setTimeout(() => {
        const inp = document.getElementById('live-search-input');
        if (inp) {

          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      }, 60);

      if (state.activeTab !== 'home') return;
      openSearchOverlay();

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Voice mic unavailable — try typing "chawal" or "tel".', 'amber');
        return;
      }

      try {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        state.voiceListening = true;
        renderSearchOverlay();
        showToast('Listening... Say "Toor Dal", "Chawal", or "Mustard Oil"', 'emerald');

        recognition.onresult = (event) => {
          state.voiceListening = false;
          state.searchQuery = event.results[0][0].transcript;
          renderSearchOverlay();
        };
        recognition.onerror = () => {
          state.voiceListening = false;
          renderSearchOverlay();
          showToast('Mic permission unavailable — type or pick a tag.', 'amber');
        };
        recognition.onend = () => {
          state.voiceListening = false;
          renderSearchOverlay();
        };
        recognition.start();
      } catch (e) {
        state.voiceListening = false;
        showToast('Voice search unavailable in this browser.', 'amber');
      }
    }

    function buildAuthoritativeOrder(paymentMode = 'Cash on Delivery (COD)') {
      const geo = getGeo();
      const slotInfo = getSlotCutoffInfo();
      const authoritativeItems = [];
      let subtotal = 0;
      let mrpTotal = 0;
      const maxQty = Number(state.storeConfig.maxQtyPerSku) || 20;

      for (const key of Object.keys(state.cart)) {
        const entry = state.cart[key];
        const catalogItem = findItemById(entry.itemId);
        if (!catalogItem || !catalogItem.inStock || entry.qty <= 0) continue;
        const vIdx = Math.min(Math.max(0, Number(entry.variantIdx) || 0), catalogItem.variants.length - 1);
        const variant = catalogItem.variants[vIdx];
        const qty = Math.max(1, Math.min(maxQty, Math.floor(Number(entry.qty))));
        subtotal += variant.price * qty;
        mrpTotal += variant.mrp * qty;
        authoritativeItems.push({
          itemId: catalogItem.id,
          variantIdx: vIdx,
          name: catalogItem.name,
          variant: variant.label,
          qty,
          price: variant.price,
          mrp: variant.mrp,
        });
      }

      if (authoritativeItems.length === 0) return null;

      const threshold = Number(state.storeConfig.freeDeliveryThreshold) || 499;
      const feeAmt = Number(state.storeConfig.smallCartFee) || 10;
      const deliveryFee = subtotal < threshold ? feeAmt : 0;
      const grandTotal = subtotal + deliveryFee;
      const savings = Math.max(0, mrpTotal - subtotal);
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      const orderId = `WV-${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, '0')}-${Math.floor(100 + Math.random() * 899)}`;

      return sealOrderRecord({
        id: orderId,
        placedAt: `Today, ${timeStr}`,
        isoTime: now.toISOString(),
        slot: slotInfo.slotLabel,
        paymentMode,
        customerName: state.customer.name,
        customerPhone: state.customer.phone,
        address: geo.fullAddress,
        deliveryNote: (state.deliveryNote || '').trim(),
        items: authoritativeItems,
        subtotal,
        mrpTotal,
        savings,
        deliveryFee,
        grandTotal,
      });
    }

    async function adminFetchCloudOrders() {
      const url = (state.storeConfig.cloudWebhookUrl || '').trim();

      if (!url) {
        showToast('Paste your deployed Google Apps Script Web App URL first.', 'amber');
        return;
      }
      state.cloudSyncBusy = true;
      renderAdminConsole();
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.orders)) {
          state.cloudOrders = data.orders;
          showToast(`Fetched ${data.orders.length} server-verified orders from Google Sheets!`, 'emerald');
        } else {
          showToast(data?.error || 'Could not authenticate with Apps Script.', 'red');
        }
      } catch (e) {
        showToast('Fetch failed. Check Apps Script deployment ("Anyone" access).', 'red');
      } finally {
        state.cloudSyncBusy = false;
        renderAdminConsole();
      }
    }

    function adminVerifySealCode() {
      const code = (state.adminSealCheckInput || '').trim().toUpperCase();
      if (!code) {
        state.adminSealCheckResult = { ok: false, msg: 'Enter a Seal Code (e.g., WV-XXXXXXXX) or Order ID.' };
        renderAdminConsole();
        return;
      }
      const all = [...(state.cloudOrders || []), ...(state.orderLedger || [])];
      const match = all.find(
        (o) => (o.sealCode || '').toUpperCase() === code || (o.id || '').toUpperCase() === code
      );
      if (!match) {
        state.adminSealCheckResult = { ok: false, msg: `No sealed record found for "${code}". Possible edited WhatsApp bill!` };
      } else if (!verifyOrderIntegrity(match)) {
        state.adminSealCheckResult = { ok: false, msg: `⚠ ALERT: Record #${match.id} failed integrity check! Data was altered.` };
      } else {
        state.adminSealCheckResult = {
          ok: true,
          msg: `✓ AUTHENTIC ORDER: #${match.id} • ${match.customerName} • Verified Total ₹${match.grandTotal} (${match.items.length} items).`,
        };
      }
      renderAdminConsole();
    }

    function computeBatchPickingList(orders) {
      const tally = {};
      orders.forEach((o) => {
        if (!verifyOrderIntegrity(o)) return;
        (o.items || []).forEach((it) => {
          const k = `${it.name} (${it.variant})`;
          if (!tally[k]) tally[k] = { label: k, qty: 0, revenue: 0 };
          tally[k].qty += Number(it.qty) || 0;
          tally[k].revenue += (Number(it.price) || 0) * (Number(it.qty) || 0);
        });
      });
      return Object.values(tally).sort((a, b) => b.qty - a.qty);
    }

    function adminExportOrdersCSV() {
      const orders = (state.cloudOrders && state.cloudOrders.length > 0) ? state.cloudOrders : (state.orderLedger || []);
      if (orders.length === 0) { showToast('No orders to export.', 'amber'); return; }

      const headers = ['OrderID', 'SealCode', 'Integrity', 'DateTime', 'Customer', 'Phone', 'Address', 'Slot', 'Payment', 'Items', 'Subtotal', 'DeliveryFee', 'GrandTotal', 'Note'];
      const rows = orders.map((o) => {
        const itemsStr = (o.items || []).map((i) => `${i.qty}x ${i.name} (${i.variant}) @ Rs${i.price}`).join(' | ');
        const cols = [
          o.id, o.sealCode, verifyOrderIntegrity(o) ? 'VERIFIED' : 'TAMPERED',
          o.isoTime, o.customerName, o.customerPhone, o.address, o.slot, o.paymentMode,
          itemsStr, o.subtotal, o.deliveryFee, o.grandTotal, o.deliveryNote || '',
        ];
        return cols.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',');
      });
      const csv = [headers.join(','), ...rows].join('\n');

      try {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `weaverly-verified-orders-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Verified Order Ledger CSV downloaded!', 'emerald');
      } catch (e) {
        showToast('Export blocked by browser.', 'amber');
      }
    }

    // -------------------------------------------------------------------------

    function scrollCarouselTo(idx) {
      const track = document.getElementById('promo-carousel');
      if (!track) return;
      state.activeBannerIdx = idx;
      track.scrollTo({ left: idx * (track.clientWidth + 12), behavior: 'smooth' });
      updateCarouselDots();
    }

    function updateCarouselDots() {
      document.querySelectorAll('#carousel-dots button').forEach((btn, i) => {
        btn.className = `h-1.5 rounded-full transition-all ${i === state.activeBannerIdx ? 'w-5 bg-forest' : 'w-1.5 bg-slate-300'}`;
      });
    }

    function bindCarouselEvents() {
      const track = document.getElementById('promo-carousel');
      if (!track) return;
      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / (track.clientWidth + 12));
        if (idx !== state.activeBannerIdx && idx >= 0 && idx < PROMO_BANNERS.length) {
          state.activeBannerIdx = idx;
          updateCarouselDots();
        }
      }, { passive: true });
    }

    // -------------------------------------------------------------------------
    // 17. MASTER RENDER & REACTIVE UI SYNC
    // -------------------------------------------------------------------------
    function renderCurrentView(opts = {}) {
      const root = document.getElementById('view-root');
      if (!root) return;
      const prevScrollEl = opts.preserveScroll ? root.querySelector('[data-dock-scroll="true"]') : null;
      const savedScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;

      if (state.activeTab === 'home') root.innerHTML = renderHomeView();
      else if (state.activeTab === 'categories') root.innerHTML = renderCategoriesView();
      else if (state.activeTab === 'orders') root.innerHTML = renderOrdersView();
      else if (state.activeTab === 'account') root.innerHTML = renderAccountView();

      bindScrollListeners();
      if (state.activeTab === 'home') bindCarouselEvents();

      if (opts.preserveScroll && savedScrollTop > 0) {
        const newScrollEl = root.querySelector('[data-dock-scroll="true"]');
        if (newScrollEl) newScrollEl.scrollTop = savedScrollTop;
      }
    }

    function syncAllUI() {
      renderCurrentView({ preserveScroll: true });
      renderFloatingDock();

      const searchOverlay = document.getElementById('search-overlay');
      if (searchOverlay && !searchOverlay.classList.contains('hidden')) renderSearchResultsBody();

      const pdpModal = document.getElementById('pdp-modal');
      if (pdpModal && !pdpModal.classList.contains('hidden') && state.pdpItemId) renderPDPSheet();

      const cartModal = document.getElementById('cart-modal');
      if (cartModal && !cartModal.classList.contains('hidden')) renderCartDrawer();
    }

    document.addEventListener('keydown', (e) => {
      const pinModal = document.getElementById('pin-modal');
      if (!pinModal || pinModal.classList.contains('hidden')) return;
      if (e.key >= '0' && e.key <= '9') pressPinDigit(Number(e.key));
      else if (e.key === 'Backspace') backspacePin();
      else if (e.key === 'Escape') closePinModal();
    });

    // -------------------------------------------------------------------------
    // 18. APP BOOTSTRAP & TIMERS
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
      renderFloatingDock();

      setInterval(() => {
        state.placeholderIdx = (state.placeholderIdx + 1) % SEARCH_PLACEHOLDERS.length;
        const ph = document.getElementById('animated-search-placeholder');
        if (ph && state.activeTab === 'home') {
          ph.textContent = SEARCH_PLACEHOLDERS[state.placeholderIdx];
        }
      }, 2800);

      setInterval(() => {
        if (state.activeTab === 'home' && state.homeFilter === 'All') {
          const track = document.getElementById('promo-carousel');
          if (track) scrollCarouselTo((state.activeBannerIdx + 1) % PROMO_BANNERS.length);
        }
      }, 5500);
    });
  </script>
</body>
</html>
